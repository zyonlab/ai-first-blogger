name: "Bug: something broke"
description: A command crashed, a build failed, or the output is wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the framework got in the way of a *decision* rather than breaking,
        use **Boundary** instead. If a `C-nn` rule judged wrongly, use **Gate**.

        The failure mode worth naming here: **something that silently did
        nothing.** This project has shipped that five times — a check whose
        indices were off by one, a template override that never resolved while
        the build log still reported success. If the output is wrong but nothing
        errored, that is the most valuable kind of bug report, not the weakest.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what came out.
      placeholder: |
        `pnpm build` succeeded and logged "1 overridden", but dist/ still contains
        the engine's markup. No error anywhere.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        From `npm create aifb@latest` if you can — a repro that starts from the
        scaffold can be run here without guessing at your site.
      placeholder: |
        1. npm create aifb@latest repro --example indie-ai-builder
        2. add site/templates/components/Footer.astro with any content
        3. pnpm build
        4. grep dist/index.html — the engine's footer is still there
      render: text
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Command output
      description: The whole thing, including the lines before the failure.
      render: text
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `npx aifb env`.
      render: text
    validations:
      required: true
