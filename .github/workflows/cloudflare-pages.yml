name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # A pull request gets the same gate plus a preview deploy. The preview is
  # built with DEPLOY_CONTEXT=preview, so it is noindex, ships no sitemap and
  # disallows crawling — a byte-identical copy of the site on another hostname
  # would otherwise split the ranking of every page with production.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # REQUIRED: set both before the first deploy. See docs/getting-started.md step 4.
  # The workflow fails fast with instructions if these are left as placeholders.
  CLOUDFLARE_PAGES_PROJECT_NAME: REPLACE_ME
  PUBLIC_SITE_URL: https://REPLACE_ME.pages.dev

jobs:
  # Is there anywhere to deploy to yet?
  #
  # This used to be a step inside the deploy job that exited 1 on REPLACE_ME.
  # A site that has not chosen its project name has not finished setting up, and
  # a red run is the wrong way to say so — the loud version already exists in
  # the right place: `aifb validate` refuses to run the content pipeline at all
  # while the domain is a placeholder, and names the file and the line.
  #
  # So an unconfigured site *skips* the deploy instead of failing it. Nothing is
  # published either way; the difference is whether the signal points at the
  # decision you have not made or at a workflow you have not read.
  configured:
    name: Deploy target
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ "$CLOUDFLARE_PAGES_PROJECT_NAME" = "REPLACE_ME" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped — CLOUDFLARE_PAGES_PROJECT_NAME is still REPLACE_ME."
            echo "Set it and PUBLIC_SITE_URL in .github/workflows/cloudflare-pages.yml."
            echo "See docs/getting-started.md step 4."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  # The framework's own tests, and the reason they gate the deploy.
  #
  # `validate` proves the *content* is publishable. It cannot prove the checks
  # themselves still work — three times in this project a rule was present and
  # wired to nothing (a theme check whose block indices were off by one, C-12
  # counting tokens file-wide, C-22 counting the wrong elements), and each time
  # `validate` was green throughout. Running the suites by hand is how that
  # happens a fourth time.
  framework:
    name: Framework tests
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every rule still catches its own violation
        run: pnpm validate:self-test

      - name: The pipeline still behaves across layers
        run: pnpm test:scenarios

  deploy:
    name: Build and deploy
    needs: framework
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          DEPLOY_CONTEXT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

      - name: Validate content and SEO
        run: pnpm validate

      # Reported, never blocking: T1/T2 measure whether the repo is still a
      # framework, and the style score points at paragraphs worth rewriting.
      # Neither is a reason to withhold a build that passed 27 rules — but a
      # number nobody records is a number nobody watches.
      - name: Framework health and writing style
        continue-on-error: true
        run: |
          pnpm metrics
          pnpm analyze

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            validate-report.json
            metrics.json
            content-report.json
          retention-days: 14

      - name: Check deploy credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set."
            echo "Add them as repository secrets — Settings → Secrets and variables → Actions."
            echo "See .env.example for what each one is."
            exit 1
          fi

      - name: Deploy
        run: |
          pnpm dlx wrangler@latest pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "${{ github.head_ref || 'main' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Lighthouse runs beside the deploy, not inside it. It needs headless Chrome
  # and takes minutes against the whole site, while `pnpm validate` takes about
  # a second — putting it in the blocking path would trade the gate's speed and
  # determinism for an audit that overlaps with it. A failure here is a report
  # to act on, not a reason to withhold a build that already passed 24 rules.
  audit:
    name: Lighthouse SEO audit
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Audit
        run: pnpm audit:seo

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
