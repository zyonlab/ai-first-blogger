name: Deploy to Cloudflare Pages

"on":
  push:
    branches:
      - main
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.ref_name == 'main' && 'main' || 'release' }}
      PUBLIC_SITE_URL: ${{ github.ref_name == 'main' && vars.PRODUCTION_SITE_URL || vars.STAGING_SITE_URL }}
      PUBLIC_DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Phase 0 guardrail tests
        run: pnpm test:phase-zero

      - name: Content workflow tests
        run: pnpm test:phase-one

      - name: Writing style and source policy tests
        run: pnpm test:phase-two

      - name: Static blog capability tests
        run: pnpm test:phase-three

      - name: Search and page-quality tests
        run: pnpm test:phase-four

      - name: Guarded MCP write tests
        run: pnpm test:mcp-write

      - name: Framework portability tests
        run: pnpm test:phase-five

      - name: Roadmap contract
        run: pnpm roadmap:validate

      - name: Prompt regression fixtures
        run: pnpm prompt:regression

      - name: Build
        run: pnpm build

      - name: Deploy
        run: pnpm dlx wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch "$DEPLOY_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
