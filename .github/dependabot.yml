version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro-and-tooling:
        patterns:
          - astro
          - "@astrojs/*"
          - typescript
          - tsx
      content-and-rendering:
        patterns:
          - gray-matter
          - mermaid
          - turndown
          - zod
          - "@modelcontextprotocol/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
