version: "1.0.0"
purpose: "Keep automated evidence separate from accountable editorial decisions."
dimensions: [factual, teaching, writing-style, seo, display]
machineCheckStatuses: [pass, warn, fail]
publicationDecisions: [pending, approved, blocked]
rules:
  - "Machine checks record observable evidence and never calculate an auto-publish score."
  - "A human reviewer records a decision and rationale for every dimension."
  - "Publication approval requires every human dimension to pass."
  - "Any unresolved blocking risk prevents publication approval."
dimension_contracts:
  factual:
    machine_signals: ["fact-ledger validation", "source freshness", "unsupported-claim warnings"]
    human_question: "Are the claims accurate, appropriately scoped, and supported by suitable evidence?"
  teaching:
    machine_signals: ["required examples", "heading structure", "undefined-term warnings"]
    human_question: "Can the target reader build the intended mental model or complete the intended task?"
  writing-style:
    machine_signals: ["formula repetition", "filler phrases", "unsupported conclusions"]
    human_question: "Does the article sound deliberate, specific, and consistent with the approved author profile when enabled?"
  seo:
    machine_signals: ["metadata validation", "canonical URL", "internal-link checks"]
    human_question: "Does the page satisfy the search intent without distorting the article for keywords?"
  display:
    machine_signals: ["build success", "heading hierarchy", "image metadata"]
    human_question: "Is the article readable and understandable across supported themes and viewport sizes?"
