schema_version: "1.0.0"
kind: search-console-performance-review
id: search-review-YYYY-MM
status: draft

# Use complete Search Console dates. The API interprets dates in Pacific Time.
review_period:
  start: YYYY-MM-DD
  end: YYYY-MM-DD
reviewed_at: YYYY-MM-DDTHH:MM:SSZ
reviewer: "role-or-agent-with-human-verifier"

property:
  environment: production
  label: "<public-production-domain>"

# Never include verification tokens, account identifiers, authenticated URLs,
# cookies, authorization headers, API keys, OAuth values, or raw private exports.
operational_checks:
  - area: ownership
    status: not-checked
    result: ""
    observations: []
    evidence_ref: ""
  - area: sitemap
    status: not-checked
    result: ""
    observations: []
    evidence_ref: ""
  - area: indexing
    status: not-checked
    result: ""
    observations: []
    evidence_ref: ""
  - area: manual-actions
    status: not-checked
    result: ""
    observations: []
    evidence_ref: ""
  - area: security-issues
    status: not-checked
    result: ""
    observations: []
    evidence_ref: ""
  - area: core-web-vitals
    status: not-checked
    result: ""
    observations: []
    evidence_ref: ""

export:
  source: search-console-ui
  data_state: final
  aggregation: page
  sanitized: true
  limitations:
    - "Search Console can omit anonymized and lower-volume query rows."
    - "Totals can differ from grouped rows because of privacy and aggregation rules."

totals:
  clicks: 0
  impressions: 0
  ctr: 0
  position: 0

dimensions_reviewed:
  queries: true
  pages: true
  countries: true
  devices: true

# Include enough rows to cover query, page, country, and device. CTR is 0..1.
observations:
  - id: observation-example
    query: "<sanitized-query>"
    page: "/public-page-path/"
    country: CHN
    device: MOBILE
    metrics:
      clicks: 0
      impressions: 0
      ctr: 0
      position: 0
    finding: "Measured fact for the stated review period; remove this example before approval."

recommendations:
  - id: recommendation-example
    status: proposed
    action: improve-existing
    observation_ids: [observation-example]
    observed_period:
      start: YYYY-MM-DD
      end: YYYY-MM-DD
    reader_need: "What the reader is trying to understand or accomplish."
    content_gap: "What the existing page or plan does not yet answer."
    recommendation: "A reviewable change; remove this example if there is no supported action."
    planning_targets: ["content-work/briefs/<brief-id>.yaml"]
    evidence_basis:
      - type: search-console-observation
        reference: observation-example

approval:
  approved_by: null
  approved_at: null
  notes: "Approval confirms the artifact is sanitized; it does not auto-publish changes."
