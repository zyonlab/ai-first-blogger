pipeline:
  purpose: "Help agents plan, research, write, edit, optimize, and maintain technical blog content without relying on vague one-shot prompts."
  default_output_language: "zh-CN"
  operating_rule: "Never write the final article before the research brief, series plan, or article brief is explicit."
  display_rule: "Do not render navigation items, homepage sections, cards, CTAs, or placeholder copy for content types that have no published content."
  voice_rule: "Write like a specific technical author, not a generic assistant. Keep concrete judgment, constraints, and lived tradeoffs; remove filler and placeholder language."

writing_skill_hooks:
  purpose: "Let each site control writing and teaching style with user-configured skills without making those preferences framework defaults."
  registry: "content-plans/site-plan.yaml#writing_skills.active"
  allowed_root: ".ai/site-skills"
  resolution_rule: "Load enabled skills registered for the selected stage, run before hooks before the framework stage, and run after hooks before the stage quality gate."
  precedence:
    - "Repository safety, source integrity, schema, draft, validation, and deployment rules always win."
    - "The framework stage contract controls required inputs and outputs."
    - "Site writing skills control voice, pedagogy, structure, examples, evidence treatment, and search expression inside that contract."
  stages:
    topic_research: [before, after]
    series_planning: [before, after]
    article_brief: [before, after]
    draft: [before, after]
    teaching_review: [before, after]
    human_edit: [before, after]
    seo_geo_optimization: [before, after]
    publishing_review: [before]
  trace_rule: "Record skill id, configured version, path, stage, and hook phase in generated workflow artifacts when those artifacts exist."

methodologies:
  backward_design:
    use_for: "Series planning and article objectives."
    rule: "Start with what the reader should be able to understand, decide, or do after reading."
  diataxis:
    use_for: "Classifying content type."
    types:
      tutorial: "Learning-oriented, step-by-step path."
      how_to: "Task-oriented procedure."
      explanation: "Understanding-oriented conceptual model."
      reference: "Information-oriented facts, APIs, options, tables."
  cognitive_load_theory:
    use_for: "Readability and structure."
    rule: "Reduce unnecessary load, split concepts, introduce terms before using them, and avoid parallel abstractions too early."
  worked_examples:
    use_for: "Technical teaching."
    rule: "Prefer complete examples, annotated code, before/after comparisons, and error cases over abstract claims."
  scaffolding:
    use_for: "Series sequencing."
    rule: "Give more guidance early in the series, then gradually increase independence."
  pyramid_principle:
    use_for: "Executive summaries and AI-readable answer blocks."
    rule: "Lead with the answer, then support it with reasons, examples, and tradeoffs."

stages:
  - id: topic_research
    goal: "Understand reader intent, source material, competing content, and missing angles."
    inputs: ["topic", "target_reader", "business_goal", "content_pillar"]
    outputs:
      [
        "reader_problem",
        "search_intents",
        "source_list",
        "competitor_patterns",
        "content_gap",
        "angle",
      ]
    agent_should:
      - "Use primary sources when facts or APIs can change."
      - "Separate stable conceptual claims from time-sensitive details."
      - "Record unanswered questions instead of filling gaps with generic text."
  - id: series_planning
    goal: "Turn a domain into a teachable sequence."
    inputs: ["domain", "audience_level", "reader_outcome", "content_pillar"]
    outputs:
      [
        "series_title",
        "learning_path",
        "article_sequence",
        "internal_links",
        "difficulty_curve",
      ]
    agent_should:
      - "Use backward design for the series outcome."
      - "Use scaffolding to order articles from foundation to applied judgment."
      - "Avoid mixing tutorial, reference, and opinion goals in the same article unless intentional."
  - id: article_brief
    goal: "Create a precise writing contract before drafting."
    inputs: ["topic_research", "series_plan", "target_reader", "search_intent"]
    outputs:
      [
        "title",
        "description",
        "slug",
        "outline",
        "definitions",
        "examples",
        "diagrams",
        "faq",
        "internal_links",
      ]
    agent_should:
      - "Mark every H2 with its reader job."
      - "Specify where code, Mermaid, tables, or images are needed."
      - "Include a direct answer block for GEO."
  - id: draft
    goal: "Write a useful first version."
    inputs: ["article_brief"]
    outputs: ["mdx_article"]
    agent_should:
      - "Use concrete examples before broad abstractions."
      - "Prefer short paragraphs and explicit transitions."
      - "Include tradeoffs, failure modes, and decision criteria."
  - id: teaching_review
    goal: "Improve comprehension."
    inputs: ["mdx_article", "article_brief"]
    outputs: ["readability_fixes", "missing_examples", "structure_changes"]
    agent_should:
      - "Check whether each section answers one clear reader question."
      - "Reduce cognitive load by splitting dense sections."
      - "Add worked examples where claims are abstract."
  - id: human_edit
    goal: "Remove generic AI tone and add credible judgment."
    inputs: ["mdx_article"]
    outputs: ["edited_article", "voice_notes"]
    agent_should:
      - "Delete filler claims, symmetrical lists, and vague superlatives."
      - "Remove placeholder phrases such as 即将更新, 敬请期待, 预留, 占位, 内容资产, 一站式, 赋能, 深度解析 unless the author explicitly wants them."
      - "Add constraints, personal judgment, edge cases, and practical tradeoffs."
      - "Keep the author's style consistent with src/data/site.ts and existing articles."
  - id: display_review
    goal: "Keep the public site honest when content is missing."
    inputs: ["content_inventory", "changed_pages", "navigation"]
    outputs: ["hidden_empty_sections", "visible_content_entries", "remaining_empty_states"]
    agent_should:
      - "Check src/content/** before showing homepage sections or nav links."
      - "Hide empty content modules instead of showing coming-soon text."
      - "Only keep static pages visible when they provide real information without content entries."
  - id: seo_geo_optimization
    goal: "Make the article discoverable by search engines and answer engines."
    inputs: ["edited_article", "site_context", "content_inventory"]
    outputs:
      [
        "title_meta",
        "description_meta",
        "entity_coverage",
        "faq",
        "internal_links",
        "schema_notes",
      ]
    agent_should:
      - "Use one primary intent per page."
      - "Add clear definitions, summaries, FAQs, and internal links."
      - "Verify canonical, JSON-LD, sitemap, RSS, robots.txt, and llms.txt build."
  - id: publishing_review
    goal: "Ship safely."
    inputs: ["changed_files"]
    outputs: ["validation_result", "deployment_target", "follow_up_tasks"]
    agent_should:
      - "Run a display review when content is added, removed, or reorganized."
      - "Run pnpm check."
      - "Run pnpm build for content, SEO/GEO, layout, MCP, or deploy changes."
      - "Use release for staging and main for production."

quality_gates:
  article:
    - "The reader can identify the article promise in the first screen."
    - "Every H2 has a distinct reader job."
    - "Key terms are defined before use."
    - "At least one concrete example, code block, diagram, table, or decision checklist supports the main claim."
    - "The article includes tradeoffs or failure modes."
    - "Internal links connect to related topics, series, projects, or posts."
    - "The article avoids generic assistant phrasing and uses concrete author judgment."
  display:
    - "Navigation only links to content collections that have published entries."
    - "Homepage sections only appear when they contain real entries."
    - "Email, social, domain, and external channel links only appear when real values are configured."
    - "No public page uses coming-soon or placeholder copy unless the user explicitly asked for a roadmap."
  series:
    - "The series has an explicit reader outcome."
    - "Article order follows a difficulty curve."
    - "Each article has a distinct intent and does not duplicate another article."
    - "The final article helps the reader make or execute a real decision."
