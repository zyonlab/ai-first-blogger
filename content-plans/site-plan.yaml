site:
  purpose: "Turn a static Astro blog into an AI-first content system."
  audience:
    primary: "technical creators, indie hackers, developer advocates, consultants"
    secondary: "teams that need a maintainable knowledge base or technical content hub"
  positioning: "AI-configurable blog framework with structured content, SEO/GEO checks, prompts, and automated deployment."

brand_inputs:
  required:
    - brand_name
    - domain
    - author_or_team_name
    - contact_email
    - social_links
    - target_audience
    - content_domains
    - monetization_or_conversion_goal
  optional:
    - logo
    - brand_voice
    - color_preference
    - existing_content_export
    - youtube_channel

content_pillars:
  - id: foundations
    name: "Foundations"
    goal: "Explain core concepts and establish topical authority."
    formats: ["pillar article", "glossary", "FAQ"]
  - id: playbooks
    name: "Playbooks"
    goal: "Give repeatable workflows users can execute."
    formats: ["how-to", "checklist", "template"]
  - id: case-studies
    name: "Case Studies"
    goal: "Show applied credibility and decision quality."
    formats: ["case study", "before-after", "architecture note"]
  - id: opinions
    name: "Point of View"
    goal: "Differentiate the creator's perspective."
    formats: ["essay", "trend analysis", "comparison"]

seo_geo_rules:
  - "One clear search intent per page."
  - "Use descriptive H1/H2/H3 hierarchy; no decorative headings."
  - "Add direct definitions, steps, examples, and tradeoffs."
  - "Use internal links between topics, series, projects, and case studies."
  - "Expose canonical URL, Open Graph, RSS, sitemap, robots.txt, and llms.txt."
  - "Prefer stable facts, author context, and concrete dates over vague claims."

maintenance_cadence:
  weekly:
    - "Generate or refine 1-3 article briefs."
    - "Check failed builds and broken links."
  monthly:
    - "Refresh content plan and internal links."
    - "Audit top landing pages for SEO/GEO clarity."
  quarterly:
    - "Revisit brand positioning, navigation, and content pillars."
