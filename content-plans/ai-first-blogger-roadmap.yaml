roadmap:
  name: "AI First Blogger maturity roadmap"
  audited_at: "2026-07-11"
  last_updated_at: "2026-07-11"
  completed_through: "phase-1"
  phase_2_progress: "AFB-201, AFB-202, and AFB-203 complete. AFB-204 validates Codex; Claude Code and OpenClaw reached their runtimes but local credentials blocked model output. AFB-205 implementation is active."
  phase_3_progress: "AFB-301 through AFB-306 complete with static discovery, related navigation, image and redirect validation, scheduled publishing, and freshness maintenance."
  cross_phase_progress: "Phase 4 is complete. AFB-501, AFB-503, AFB-504, and AFB-505 are complete; AFB-502 remains dependent on AFB-204 host credentials."
  baseline_ai_first_maturity_percent: 45
  baseline_blogger_maturity_percent: 50
  goal: "Make planning, research, writing, review, publishing, and maintenance reproducible across agents and human contributors."
  source_of_truth: "docs/research/ai-first-blogger-gap-analysis.md"
  execution_rule: "Select ready tasks whose dependencies are complete; implement acceptance checks before marking a task complete."

statuses: [backlog, ready, in_progress, blocked, complete]

priorities:
  P0: "Prevents invalid publication or establishes a required contract."
  P1: "Required for a reliable AI-first authoring system."
  P2: "Required for mature operation at meaningful content scale."
  P3: "Optional ecosystem or business capability."

phases:
  - id: phase-0
    name: "Trustworthy publishing baseline"
    outcome: "Invalid domains, schemas, links, or unpublished references fail CI."
  - id: phase-1
    name: "Executable content contracts"
    outcome: "Every pipeline stage produces a validated, reusable artifact."
  - id: phase-2
    name: "Voice and evidence stability"
    outcome: "Model changes do not silently alter structure, facts, or author voice."
  - id: phase-3
    name: "Mature personal publishing"
    outcome: "The site remains discoverable and maintainable at 20-100 articles."
  - id: phase-4
    name: "Search feedback loop"
    outcome: "Content decisions use indexing, query, CTR, and page experience evidence."
  - id: phase-5
    name: "Adapters and ecosystem"
    outcome: "New sites and agent hosts can adopt the framework without forking its rules."

tasks:
  - id: AFB-001
    phase: phase-0
    priority: P0
    status: complete
    title: "Define core and optional product capabilities"
    depends_on: []
    deliverables: ["docs/product/capability-contract.md"]
    acceptance:
      - "Classifies capabilities as core, Git-native replacement, or optional adapter."
      - "States when Ghost or another CMS should be introduced."
      - "Defines the supported single-author baseline."
    evidence: ["docs/product/capability-contract.md"]

  - id: AFB-002
    phase: phase-0
    priority: P0
    status: complete
    title: "Validate site configuration and production URL"
    depends_on: []
    deliverables: ["Typed site configuration schema", "Build-time environment validation", "Configuration fixtures"]
    acceptance:
      - "Production and staging builds fail for placeholder or malformed public URLs."
      - "Brand, author, locale, social links, and theme key are validated."
      - "Empty optional links remain allowed and hidden."
    evidence: ["src/data/site.ts", "astro.config.mjs", "scripts/test-phase-zero.mjs"]

  - id: AFB-003
    phase: phase-0
    priority: P0
    status: complete
    title: "Align structured data with visible content"
    depends_on: [AFB-002]
    deliverables: ["Article schema with images", "Valid VideoObject", "ProfilePage markup", "Live-content-only llms.txt"]
    acceptance:
      - "JSON-LD parses on every generated page."
      - "Video pages include Google-supported required properties."
      - "llms.txt contains no URL that returns 404."
      - "Schema content is visible on the corresponding page."
    evidence: ["src/lib/schema.ts", "src/pages/videos/[slug].astro", "src/pages/about.astro", "src/pages/llms.txt.ts"]

  - id: AFB-004
    phase: phase-0
    priority: P0
    status: complete
    title: "Add technical SEO and link validation"
    depends_on: [AFB-002, AFB-003]
    deliverables: ["Internal link checker", "Canonical and sitemap validator", "Orphan-page report", "CI gate"]
    acceptance:
      - "Broken internal links fail CI."
      - "Canonical URLs use the configured public origin."
      - "Every indexable content page appears in the sitemap and has an inbound link."
      - "Draft and future content are absent from public outputs."
    evidence: ["scripts/validate-build.mjs", "src/lib/content.ts", ".github/workflows/cloudflare-pages.yml"]

  - id: AFB-005
    phase: phase-0
    priority: P1
    status: complete
    title: "Make builds reproducible"
    depends_on: []
    deliverables: ["Dependency version policy", "Controlled update workflow"]
    acceptance:
      - "Direct dependencies do not use unbounded latest versions."
      - "CI uses the lockfile and documented Node and pnpm versions."
    evidence: ["package.json", "pnpm-lock.yaml", "docs/playbooks/dependency-updates.md", ".github/dependabot.yml"]

  - id: AFB-101
    phase: phase-1
    priority: P0
    status: complete
    title: "Define schemas for pipeline artifacts"
    depends_on: [AFB-001]
    deliverables: ["Research schema", "Series schema", "Brief schema", "Fact ledger schema", "Review schema"]
    acceptance:
      - "Every artifact has version, status, owner, dates, inputs, and outputs."
      - "Validation reports exact fields and remediation."
      - "One passing and one failing fixture exist per artifact type."
    evidence: ["src/content-workflow/schemas.ts", "scripts/test-phase-one.ts"]

  - id: AFB-102
    phase: phase-1
    priority: P1
    status: complete
    title: "Create content-type-specific templates"
    depends_on: [AFB-101]
    deliverables: ["Tutorial template", "How-to template", "Explanation template", "Reference template", "Opinion template", "Case-study template", "Video companion template"]
    acceptance:
      - "Each template defines reader job, required evidence, optional sections, and anti-patterns."
      - "FAQ and direct-answer sections are conditional rather than universal."
    evidence: ["content-plans/content-types.yaml"]

  - id: AFB-103
    phase: phase-1
    priority: P1
    status: complete
    title: "Add content workflow CLI"
    depends_on: [AFB-101, AFB-102]
    deliverables: ["content:new", "content:validate", "content:audit"]
    acceptance:
      - "Commands are non-interactive when complete inputs are supplied."
      - "Commands are idempotent or refuse unsafe overwrites."
      - "Validation output is useful to humans and agents."
    evidence: ["scripts/content-workflow.ts", "src/content-workflow/workflow.ts", "package.json"]

  - id: AFB-104
    phase: phase-1
    priority: P1
    status: complete
    title: "Enforce content lifecycle states"
    depends_on: [AFB-101, AFB-103]
    acceptance:
      - "Allowed transitions are explicit."
      - "A draft cannot publish without an approved brief and completed reviews."
      - "State changes remain reviewable in Git."
    evidence: ["content-plans/content-pipeline.yaml", "src/content-workflow/workflow.ts", "src/content.config.ts"]

  - id: AFB-105
    phase: phase-1
    priority: P1
    status: complete
    title: "Deduplicate Skill, MCP, Prompt, and documentation rules"
    depends_on: [AFB-101]
    acceptance:
      - "Methodology and quality gates have one canonical source."
      - "Adapters expose contract versions."
      - "A consistency check detects stale duplicated rules."
    evidence: ["content-plans/content-pipeline.yaml", ".ai/skills/ai-first-blogger/SKILL.md", "mcp/server.ts", "src/content-workflow/workflow.ts"]

  - id: AFB-201
    phase: phase-2
    priority: P1
    status: complete
    title: "Create optional author writing-style profile and golden corpus contract"
    depends_on: [AFB-101]
    acceptance:
      - "Voice rules describe evidence and judgment, not only banned words."
      - "Three to five reference articles are approved by the author."
      - "Positive and negative style examples are included."
    evidence: ["content-plans/author-style.yaml", "src/content-workflow/schemas.ts", "scripts/test-phase-two.ts"]

  - id: AFB-202
    phase: phase-2
    priority: P0
    status: complete
    title: "Add fact and source ledger"
    depends_on: [AFB-101]
    acceptance:
      - "Time-sensitive claims require a primary source, access date, and review date."
      - "Personal experience identifies author-provided evidence."
      - "Unsupported high-impact claims block publication."
    evidence: ["content-plans/source-policy.yaml", "src/content-workflow/schemas.ts", "src/content-workflow/workflow.ts", "scripts/test-phase-two.ts"]

  - id: AFB-203
    phase: phase-2
    priority: P1
    status: complete
    title: "Detect template and voice drift"
    depends_on: [AFB-201, AFB-202]
    acceptance:
      - "Flags repeated formulas, filler, unsupported conclusions, and excessive symmetry."
      - "Warnings include locations and review questions."
      - "Heuristic scores never publish or reject content alone."
    evidence: ["src/content-workflow/editorial.ts", "scripts/editorial-audit.ts", "scripts/test-phase-two.ts"]

  - id: AFB-204
    phase: phase-2
    priority: P1
    status: in_progress
    title: "Version prompts and add regression fixtures"
    depends_on: [AFB-102, AFB-201]
    acceptance:
      - "Prompt changes produce a reviewable regression report."
      - "Five to ten golden briefs cover supported content types."
      - "Codex, Claude Code, and one OpenClaw-like host emit compatible artifacts."
    evidence: ["prompts/manifest.yaml", "prompts/regression/golden-briefs.yaml", "scripts/prompt-regression.ts"]
    remaining:
      - "Refresh local Claude Code and OpenClaw provider credentials, rerun the shared prompt, and replace their auditable failure records with schema-valid outputs."

  - id: AFB-205
    phase: phase-2
    priority: P2
    status: in_progress
    title: "Create machine and human editorial scorecard"
    depends_on: [AFB-203, AFB-204]
    acceptance:
      - "Separates factual, teaching, voice, SEO, and display quality."
      - "Records reviewer decisions and unresolved risks."
      - "Machine signals cannot approve or reject publication without explicit human decisions."
    evidence: ["content-plans/editorial-scorecard.yaml", "src/content-workflow/schemas.ts", "src/content-workflow/workflow.ts", "scripts/test-phase-two.ts"]
    remaining:
      - "Complete AFB-204 host compatibility before marking the dependent task complete."

  - id: AFB-301
    phase: phase-3
    priority: P2
    status: complete
    title: "Add search, pagination, archives, and tag pages"
    depends_on: [AFB-004]
    acceptance:
      - "Works without a server-side database."
      - "Filter and pagination state uses URLs where applicable."
      - "Empty indexes remain hidden."
    evidence: ["src/pages/search.astro", "src/pages/search-index.json.ts", "src/pages/archive", "src/pages/tags", "src/lib/discovery.ts", "scripts/test-discovery.ts"]

  - id: AFB-302
    phase: phase-3
    priority: P2
    status: complete
    title: "Add contextual related-content navigation"
    depends_on: [AFB-004]
    acceptance:
      - "Uses series, topic, tags, and explicit relationships."
      - "Published content gains useful inbound links as inventory grows."
    evidence: ["src/components/RelatedContent.astro", "src/lib/discovery-ranking.ts", "src/pages/writing/[slug].astro", "src/pages/videos/[slug].astro", "src/pages/projects/[slug].astro", "src/pages/case-studies/[slug].astro"]

  - id: AFB-303
    phase: phase-3
    priority: P1
    status: complete
    title: "Build image and social-card pipeline"
    depends_on: [AFB-003]
    acceptance:
      - "Images have descriptive filenames, dimensions, alt text, and responsive output."
      - "Article and OG images are representative and crawlable."
      - "CI detects missing required image metadata."
    evidence: ["content-plans/images.yaml", "scripts/images.ts", "scripts/lib/images.ts", "scripts/test-images.ts", "package.json"]

  - id: AFB-304
    phase: phase-3
    priority: P2
    status: complete
    title: "Support scheduled publishing"
    depends_on: [AFB-104]
    acceptance:
      - "Future-dated content is excluded before publication time."
      - "A scheduled Action can rebuild without manual edits."
      - "Timezone behavior is explicit and tested."
    evidence: [".github/workflows/scheduled-publish.yml", "scripts/scheduled-content.ts", "src/content-workflow/freshness.ts", "scripts/test-content-freshness.ts", "docs/playbooks/scheduled-publishing.md"]

  - id: AFB-305
    phase: phase-3
    priority: P1
    status: complete
    title: "Generate and validate redirects"
    depends_on: [AFB-004]
    acceptance:
      - "Legacy slugs generate Cloudflare-compatible redirects."
      - "Redirect chains and loops fail validation."
    evidence: ["content-plans/redirects.yaml", "scripts/redirects.ts", "scripts/lib/redirects.ts", "scripts/test-redirects.ts", "public/_redirects"]

  - id: AFB-306
    phase: phase-3
    priority: P2
    status: complete
    title: "Create content freshness maintenance"
    depends_on: [AFB-202]
    acceptance:
      - "Time-sensitive content records a review interval."
      - "A command lists stale claims and articles."
      - "dateModified changes only after substantive edits."
    evidence: ["src/content.config.ts", "src/content-workflow/freshness.ts", "scripts/content-freshness.ts", "scripts/test-content-freshness.ts"]

  - id: AFB-401
    phase: phase-4
    priority: P1
    status: complete
    title: "Establish Search Console operations"
    depends_on: [AFB-004]
    acceptance:
      - "Ownership verification and sitemap submission are documented."
      - "Monthly checks cover indexing, performance, manual actions, security, and Core Web Vitals."
    evidence: ["docs/playbooks/search-console-operations.md", "content-plans/search-console-monthly-review.template.yaml"]

  - id: AFB-402
    phase: phase-4
    priority: P2
    status: complete
    title: "Create search performance review artifacts"
    depends_on: [AFB-401]
    acceptance:
      - "Tracks queries, pages, clicks, impressions, CTR, position, country, and device."
      - "Stores no credentials in the repository."
      - "Recommendations cite the observed data period."
    evidence: ["src/search-operations/schemas.ts", "src/search-operations/search-evidence.ts", "scripts/search-evidence.ts", "scripts/test-search-evidence.ts", "content-plans/search-console-monthly-review.template.yaml"]

  - id: AFB-403
    phase: phase-4
    priority: P2
    status: complete
    title: "Add page experience budgets"
    depends_on: [AFB-004, AFB-303]
    acceptance:
      - "Representative templates have Lighthouse budgets."
      - "Reduced motion, focus, heading anchors, and image CLS are checked."
    evidence: ["content-plans/page-experience-budgets.yaml", "scripts/page-experience.ts", "scripts/lib/page-experience.ts", "scripts/test-page-experience.ts", "src/styles/global.css"]

  - id: AFB-404
    phase: phase-4
    priority: P2
    status: complete
    title: "Document rich-result release validation"
    depends_on: [AFB-003, AFB-401]
    acceptance:
      - "Article, video, profile, and breadcrumb pages have test records."
      - "Validation distinguishes eligibility from ranking guarantees."
    evidence: ["content-plans/rich-result-release.template.yaml", "scripts/rich-results-release.ts", "scripts/lib/rich-results.ts", "scripts/test-rich-results.ts", "docs/playbooks/rich-result-release-validation.md"]

  - id: AFB-405
    phase: phase-4
    priority: P2
    status: complete
    title: "Feed search evidence back into planning"
    depends_on: [AFB-402]
    acceptance:
      - "Brief updates cite real queries, user needs, or content gaps."
      - "The workflow rejects bulk expansion based only on keyword volume."
    evidence: ["src/search-operations/search-evidence.ts", "scripts/search-evidence.ts", "scripts/test-search-evidence.ts"]

  - id: AFB-501
    phase: phase-5
    priority: P2
    status: complete
    title: "Create a clean site initialization command"
    depends_on: [AFB-002, AFB-101]
    acceptance:
      - "Generates validated brand and site-plan files from intake data."
      - "Removes template-owner strings without touching framework code."
      - "Supports dry-run mode."
    evidence: ["scripts/site-init.ts", "scripts/fixtures/site-intake.json", "scripts/test-site-init.ts", "README.md"]

  - id: AFB-502
    phase: phase-5
    priority: P2
    status: backlog
    title: "Test supported agent hosts"
    depends_on: [AFB-105, AFB-204]
    acceptance:
      - "Codex, Claude Code, and one OpenClaw/OpenCode-style host pass smoke tests."
      - "Host-specific adapters remain thin."

  - id: AFB-503
    phase: phase-5
    priority: P3
    status: complete
    title: "Define optional publishing adapters"
    depends_on: [AFB-001]
    acceptance:
      - "Newsletter, comments, analytics, memberships, and CMS are optional interfaces."
      - "Disabled adapters create no UI, secrets, scripts, or build dependency."
    evidence: ["content-plans/optional-adapters.yaml", "docs/product/capability-contract.md"]

  - id: AFB-504
    phase: phase-5
    priority: P3
    status: complete
    title: "Add Ghost and WordPress importers"
    depends_on: [AFB-101, AFB-303, AFB-305]
    acceptance:
      - "Imports content, metadata, media references, authors, and legacy URLs."
      - "Produces a migration report and never overwrites without confirmation."
    evidence: ["scripts/import-content.ts", "scripts/importers", "scripts/test-importers.ts", "docs/playbooks/ghost-wordpress-migration.md"]

  - id: AFB-505
    phase: phase-5
    priority: P2
    status: complete
    title: "Add guarded MCP write tools"
    depends_on: [AFB-103, AFB-104, AFB-105]
    acceptance:
      - "Write tools support dry-run and return a diff."
      - "Writes are limited to explicit project directories."
      - "Unsafe overwrite and publish actions require explicit confirmation."
      - "Repeated identical calls are idempotent."
    evidence: ["mcp/write-guard.ts", "mcp/write-tools.ts", "mcp/server.ts", "mcp/test-write-guard.ts", "mcp/test-protocol.ts"]
