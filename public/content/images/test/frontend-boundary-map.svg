<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Frontend module boundary map</title>
  <desc id="desc">A diagram showing app, pages, features, entities, and shared module dependency direction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>
  <g fill="none" stroke="#26364f" stroke-width="2">
    <path d="M80 144h1120M80 288h1120M80 432h1120M80 576h1120"/>
    <path d="M256 80v560M512 80v560M768 80v560M1024 80v560"/>
  </g>
  <text x="80" y="88" fill="#e8eefc" font-family="ui-sans-serif, system-ui" font-size="34" font-weight="700">Frontend Boundary Map</text>
  <text x="80" y="126" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="18">Dependency direction should stay explicit and one-way.</text>
  <g font-family="ui-sans-serif, system-ui" font-size="24" font-weight="700">
    <rect x="86" y="190" width="180" height="88" rx="18" fill="#111c2f" stroke="#67e8f9"/>
    <text x="128" y="242" fill="#e8eefc">app</text>
    <rect x="326" y="190" width="180" height="88" rx="18" fill="#111c2f" stroke="#5eead4"/>
    <text x="366" y="242" fill="#e8eefc">pages</text>
    <rect x="566" y="190" width="180" height="88" rx="18" fill="#111c2f" stroke="#a7f3d0"/>
    <text x="598" y="242" fill="#e8eefc">features</text>
    <rect x="806" y="190" width="180" height="88" rx="18" fill="#111c2f" stroke="#fbbf24"/>
    <text x="838" y="242" fill="#e8eefc">entities</text>
    <rect x="1046" y="190" width="180" height="88" rx="18" fill="#111c2f" stroke="#c4b5fd"/>
    <text x="1083" y="242" fill="#e8eefc">shared</text>
  </g>
  <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M274 234h44"/>
    <path d="M514 234h44"/>
    <path d="M754 234h44"/>
    <path d="M994 234h44"/>
  </g>
  <g fill="#67e8f9">
    <path d="M318 234l-13-8v16z"/>
    <path d="M558 234l-13-8v16z"/>
    <path d="M798 234l-13-8v16z"/>
    <path d="M1038 234l-13-8v16z"/>
  </g>
  <g fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="20">
    <text x="116" y="360">Composition root</text>
    <text x="350" y="360">Route level orchestration</text>
    <text x="578" y="360">Business capability</text>
    <text x="830" y="360">Domain model</text>
    <text x="1062" y="360">Reusable primitives</text>
  </g>
  <rect x="86" y="468" width="1140" height="116" rx="24" fill="#0f172a" stroke="#26364f"/>
  <text x="120" y="520" fill="#e8eefc" font-family="ui-sans-serif, system-ui" font-size="24" font-weight="700">Rule</text>
  <text x="120" y="556" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="20">High-level modules may depend on lower-level modules. Lower-level modules must not import product-specific code.</text>
</svg>
