<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI review workflow</title>
  <desc id="desc">A workflow diagram for diff, rules, model review, human review, and merge decision.</desc>
  <rect width="1280" height="720" rx="36" fill="#08111f"/>
  <circle cx="1050" cy="120" r="220" fill="#0e7490" opacity=".16"/>
  <circle cx="220" cy="610" r="260" fill="#047857" opacity=".14"/>
  <text x="90" y="94" fill="#e8eefc" font-family="ui-sans-serif, system-ui" font-size="36" font-weight="750">AI Review Workflow</text>
  <text x="90" y="132" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="18">Keep the model constrained by diff, rules, and human ownership.</text>
  <g font-family="ui-sans-serif, system-ui">
    <g>
      <rect x="95" y="242" width="170" height="100" rx="20" fill="#0f172a" stroke="#67e8f9"/>
      <text x="136" y="286" fill="#e8eefc" font-size="24" font-weight="700">Diff</text>
      <text x="124" y="318" fill="#94a3b8" font-size="15">changed lines</text>
    </g>
    <g>
      <rect x="325" y="242" width="170" height="100" rx="20" fill="#0f172a" stroke="#5eead4"/>
      <text x="360" y="286" fill="#e8eefc" font-size="24" font-weight="700">Rules</text>
      <text x="352" y="318" fill="#94a3b8" font-size="15">project context</text>
    </g>
    <g>
      <rect x="555" y="242" width="170" height="100" rx="20" fill="#0f172a" stroke="#a7f3d0"/>
      <text x="588" y="286" fill="#e8eefc" font-size="24" font-weight="700">Model</text>
      <text x="584" y="318" fill="#94a3b8" font-size="15">ranked findings</text>
    </g>
    <g>
      <rect x="785" y="242" width="170" height="100" rx="20" fill="#0f172a" stroke="#fbbf24"/>
      <text x="822" y="286" fill="#e8eefc" font-size="24" font-weight="700">Human</text>
      <text x="812" y="318" fill="#94a3b8" font-size="15">final judgment</text>
    </g>
    <g>
      <rect x="1015" y="242" width="170" height="100" rx="20" fill="#0f172a" stroke="#c4b5fd"/>
      <text x="1050" y="286" fill="#e8eefc" font-size="24" font-weight="700">Merge</text>
      <text x="1041" y="318" fill="#94a3b8" font-size="15">decision log</text>
    </g>
  </g>
  <g stroke="#67e8f9" stroke-width="4" stroke-linecap="round">
    <path d="M274 292h42"/>
    <path d="M504 292h42"/>
    <path d="M734 292h42"/>
    <path d="M964 292h42"/>
  </g>
  <g fill="#67e8f9">
    <path d="M316 292l-12-8v16z"/>
    <path d="M546 292l-12-8v16z"/>
    <path d="M776 292l-12-8v16z"/>
    <path d="M1006 292l-12-8v16z"/>
  </g>
  <rect x="95" y="452" width="1090" height="116" rx="24" fill="#0f172a" stroke="#24344c"/>
  <text x="130" y="506" fill="#e8eefc" font-family="ui-sans-serif, system-ui" font-size="24" font-weight="700">Invariant</text>
  <text x="130" y="542" fill="#94a3b8" font-family="ui-sans-serif, system-ui" font-size="20">The model can propose. The repository rules and reviewer decide.</text>
</svg>
