# What kinds of content this site publishes, and where each kind shows up.
#
# Worked example: examples/agent-native-engineer/site/content-types.yaml
#
# This is the half of a content type you own: what it is called, what URL it
# lives at, and which surfaces it appears on. The other half — its frontmatter
# schema, JSON-LD and card/detail components — is mechanism and lives in
# engine/content-types/<name>.ts.
#
# Both halves must exist: a key here with no engine file (or the reverse) fails
# the build by name. That is deliberate — a content type that exists in only one
# of the two places is exactly how case-studies once shipped as orphan pages.
#
# `surfaces`: omitting one means "not there".
#   nav    sort weight in the main navigation; omit to stay out of the nav
#   home   section on the home page — limit + sort weight between sections
#   rss    include entries in /rss.xml
#   llms   include entries in /llms.txt, capped at `limit`  ← the GEO surface
#   sitemap  defaults to true
#
# Walkthrough: docs/recipes/add-content-type.md

posts:
  route: writing
  label: Writing
  listTitle: Writing
  listDescription: TODO 这个分区写什么。它是 /writing/ 的 meta description 和 llms.txt 的分区说明。
  surfaces:
    nav: 10
    home: { limit: 6, order: 20 }
    rss: true
